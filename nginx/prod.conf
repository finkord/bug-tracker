# ==============================================================================
# BugTracker Production Edge Ingress & Static SPA Server
# ==============================================================================

upstream backend_service {
    server backend:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Root directory for pre-compiled React 19 SPA distribution
    root /usr/share/nginx/html;
    index index.html;

    # Security Headers (OWASP recommendations)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. API Reverse Proxy & Rate Limiting (/api/*)
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn addr_limit 25;

        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Attachment & buffer timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # 2. WebSocket Real-time Events Gateway (/socket.io/ and /events)
    location ~* ^/(socket\.io|events) {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep alive long-lived WebSocket sessions
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. Static Assets Caching (Vite immutable bundles)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 4. Frontend SPA Router (HTML5 History Mode Fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
