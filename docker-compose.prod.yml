# ==============================================================================
# BugTracker Production Stack — Customer Containerized Deployment
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# ==============================================================================

services:
  # 1. Relational Database Tier: PostgreSQL 15
  postgres:
    image: postgres:15-alpine
    container_name: bugtracker-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bug_tracker}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bug_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bugtracker-network

  # 2. In-Memory Cache, Rate Limiting & WebSocket Bus: Redis 7
  redis:
    image: redis:7-alpine
    container_name: bugtracker-redis-prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bugtracker-network

  # 3. S3-Compatible Object Storage: SeaweedFS (Local S3 service)
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: bugtracker-seaweedfs-prod
    restart: always
    command: "server -s3 -dir=/data -s3.port=8333 -ip.bind=0.0.0.0"
    volumes:
      - seaweedfs_prod_data:/data
    networks:
      - bugtracker-network

  # 4. Core Application Tier: NestJS Modular Monolith
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bugtracker-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-bug_tracker}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Production SMTP (Customer Mail Server)
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-"no-reply@company.com"}
      # Object Storage
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-any}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-any}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-bugtracker-attachments}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Security & URLs
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_access_key_change_in_production_min_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_jwt_refresh_key_change_in_production_min_32_chars}
      # Initial Admin Setup
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@bugtracker.local}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-AdminPassword123!}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-"System Administrator"}
      # External Identity Providers (OAuth2 / OIDC) & Bot Protection
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-placeholder_github_client_id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-placeholder_github_client_secret}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost/api/v1/auth/github/callback}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder_google_client_id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder_google_client_secret}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost/api/v1/auth/google/callback}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-turnstile}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-placeholder_turnstile_secret_key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bugtracker-network

  # 5. Production Ingress & Static SPA Tier: Nginx
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile.prod
    container_name: bugtracker-nginx-prod
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - bugtracker-network

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  seaweedfs_prod_data:
    driver: local

networks:
  bugtracker-network:
    driver: bridge
