# ==============================================================================
# BugTracker Production Stack — Fully Containerized Single-Command Deployment
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# ==============================================================================

services:
  # 1. Relational Database Tier: PostgreSQL 15
  postgres:
    image: postgres:15-alpine
    container_name: bugtracker-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bug_tracker}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bug_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bugtracker-network

  # 2. In-Memory Cache, Rate Limiting & WebSocket Bus: Redis 7
  redis:
    image: redis:7-alpine
    container_name: bugtracker-redis-prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bugtracker-network

  # 3. Local Transactional Email Testing Server: Mailpit
  mailpit:
    image: axllent/mailpit:latest
    container_name: bugtracker-mailpit-prod
    restart: always
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAIL_UI_PORT:-8025}:8025"     # Optional Web UI dashboard for inspecting outbound mail
    volumes:
      - mailpit_prod_data:/data
    networks:
      - bugtracker-network

  # 4. S3-Compatible Distributed Object Storage: SeaweedFS
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: bugtracker-seaweedfs-prod
    restart: always
    command: "server -s3 -dir=/data -s3.port=8333 -ip.bind=0.0.0.0"
    volumes:
      - seaweedfs_prod_data:/data
    networks:
      - bugtracker-network

  # 5. Core REST & WebSocket Application Tier: NestJS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bugtracker-backend-prod
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SYNCHRONIZE: "true"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-bug_tracker}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-"no-reply@bugtracker.local"}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: any
      S3_SECRET_ACCESS_KEY: any
      S3_BUCKET_NAME: bugtracker-attachments
      S3_FORCE_PATH_STYLE: "true"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_access_key_change_in_production_min_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_jwt_refresh_key_change_in_production_min_32_chars}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bugtracker-network

  # 6. Production Ingress & Static SPA Tier: Nginx
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile.prod
    container_name: bugtracker-nginx-prod
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - bugtracker-network

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  mailpit_prod_data:
    driver: local
  seaweedfs_prod_data:
    driver: local

networks:
  bugtracker-network:
    driver: bridge
